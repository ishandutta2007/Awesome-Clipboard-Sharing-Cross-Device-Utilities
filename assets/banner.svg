<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .device-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }

    /* Ambient pulse animations */
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes floatBeam {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulsing-orb-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .pulsing-orb-2 {
      transform-origin: 1000px 320px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .floating-card-1 {
      animation: floatBubble 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatBubble 6s ease-in-out infinite reverse;
    }
    .sync-line {
      stroke-dasharray: 8 6;
      animation: floatBeam 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Background Ambient Glow Orbs -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.2" filter="url(#softGlow)" />
  <circle class="pulsing-orb-2" cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.2" filter="url(#softGlow)" />
  <circle cx="600" cy="50" r="110" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />

  <!-- Animated Cross-Device Sync Architecture / Data Flow (Background/Midground) -->
  <g opacity="0.85">
    <!-- Connecting sync pathways between devices -->
    <path class="sync-line" d="M 280 330 C 450 300, 520 340, 600 320 S 760 300, 920 330" fill="none" stroke="#60a5fa" stroke-width="2" />
    <path class="sync-line" d="M 280 330 C 420 370, 780 370, 920 330" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dashoffset="30" />

    <!-- Node 1: Laptop / macOS & Linux -->
    <g class="floating-card-1" transform="translate(180, 275)">
      <rect width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <!-- Laptop icon -->
      <path d="M 23 27 L 39 27 L 39 36 L 23 36 Z M 20 38 L 42 38" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="56" y="28" class="badge-text" font-weight="700">Desktop / PC</text>
      <text x="56" y="44" class="device-label">macOS · Linux · Win</text>
      <!-- Mini clipboard item preview -->
      <rect x="16" y="56" width="118" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="24" y="69" font-family="monospace" font-size="10" fill="#38bdf8">📋 https://github.com/...</text>
    </g>

    <!-- Central Node: E2EE Sync Relay -->
    <g transform="translate(525, 265)">
      <circle cx="75" cy="50" r="38" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.8" filter="url(#glow)" />
      <!-- Lock / Sync Pulse icon -->
      <path d="M 67 49 L 67 44 C 67 39.5 70.5 36 75 36 C 79.5 36 83 39.5 83 44 L 83 49 M 64 49 L 86 49 L 86 63 L 64 63 Z" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
      <text x="75" y="78" text-anchor="middle" class="badge-text" font-size="11" fill="#c7d2fe">E2EE LAN / Cloud</text>
    </g>

    <!-- Node 2: Mobile / Tablet Device -->
    <g class="floating-card-2" transform="translate(870, 275)">
      <rect width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#9333ea" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" />
      <!-- Phone icon -->
      <rect x="25" y="22" width="12" height="18" rx="2" stroke="#c084fc" stroke-width="1.8" fill="none" />
      <circle cx="31" cy="37" r="1" fill="#c084fc" />
      <text x="56" y="28" class="badge-text" font-weight="700">Mobile Device</text>
      <text x="56" y="44" class="device-label" fill="#c084fc">iOS · Android</text>
      <!-- Mini clipboard item preview -->
      <rect x="16" y="56" width="118" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="24" y="69" font-family="monospace" font-size="10" fill="#c084fc">✨ 2FA Auth Token #8291</text>
    </g>
  </g>

  <!-- Foreground Title and Branding (Crisp and Centered on Top) -->
  <g transform="translate(600, 65)">
    <!-- Pill Category Badge -->
    <g transform="translate(-140, 0)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="30" y="20" class="badge-text" fill="#93c5fd" font-size="12">CROSS-DEVICE CONTINUITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" text-anchor="middle" class="title-text">
      Awesome Clipboard Sharing &amp; Utilities
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="104" text-anchor="middle" class="subtitle-text">
      Curated cross-device clipboard sync, history managers, E2EE sharing &amp; LAN continuity
    </text>

    <!-- Quick Pill Badges -->
    <g transform="translate(-240, 126)">
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#0369a1" fill-opacity="0.4" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="55" y="16" text-anchor="middle" class="badge-text" font-size="11" fill="#bae6fd">⚡ Real-Time Sync</text>

      <rect x="125" y="0" width="110" height="24" rx="12" fill="#4338ca" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.8" />
      <text x="180" y="16" text-anchor="middle" class="badge-text" font-size="11" fill="#c7d2fe">🔒 E2EE Encrypted</text>

      <rect x="250" y="0" width="105" height="24" rx="12" fill="#701a75" fill-opacity="0.4" stroke="#d946ef" stroke-width="0.8" />
      <text x="302" y="16" text-anchor="middle" class="badge-text" font-size="11" fill="#f5d0fe">🌐 Cross-Platform</text>

      <rect x="370" y="0" width="110" height="24" rx="12" fill="#15803d" fill-opacity="0.4" stroke="#22c55e" stroke-width="0.8" />
      <text x="425" y="16" text-anchor="middle" class="badge-text" font-size="11" fill="#bbf7d0">⭐ 100k+ Open Source</text>
    </g>
  </g>
</svg>
